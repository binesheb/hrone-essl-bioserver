name: Fix dashboard update button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch Dashboard.cs
        shell: python
        run: |
          from pathlib import Path

          p = Path('HROneSync/HROneSyncService/Dashboard.cs')
          s = p.read_text(encoding='utf-8')

          old = '''        var config = ConfigureServiceToCurrentExecutable(); if (!config.Success) { await WriteJson(context, new { success = false, action, message = config.Message }, 500); return; }\n        if (action == "update") { await WriteJson(context, new { success = true, action, message = "Windows service path updated.", path = CurrentExecutablePath() }, 200); return; }\n        if (_stopApplication is null) { await WriteJson(context, new { error = "Service lifecycle control is not configured." }, 503); return; }'''

          new = '''        if (action == "update")\n        {\n            var started = ScheduleGitHubUpdate();\n            await WriteJson(context, started\n                ? new { success = true, action, message = "GitHub update started. The service will stop, fetch origin/main, rebuild, republish, reconfigure and restart automatically." }\n                : new { success = false, action, message = "Could not start the GitHub update script." },\n                started ? 200 : 500);\n            return;\n        }\n        var config = ConfigureServiceToCurrentExecutable(); if (!config.Success) { await WriteJson(context, new { success = false, action, message = config.Message }, 500); return; }\n        if (_stopApplication is null) { await WriteJson(context, new { error = "Service lifecycle control is not configured." }, 503); return; }'''

          if old not in s:
              raise SystemExit('Expected ServiceControl update block was not found')
          s = s.replace(old, new, 1)

          old2 = '''    private static void ScheduleServiceStart() { try { var p = new ProcessStartInfo { FileName = "cmd.exe", UseShellExecute = false, CreateNoWindow = true, WindowStyle = ProcessWindowStyle.Hidden }; p.ArgumentList.Add("/c"); p.ArgumentList.Add("timeout /t 3 /nobreak >nul & sc.exe start HROneSyncService >nul"); Process.Start(p); } catch { } }'''

          new2 = '''    private static void ScheduleServiceStart() { try { var p = new ProcessStartInfo { FileName = "cmd.exe", UseShellExecute = false, CreateNoWindow = true, WindowStyle = ProcessWindowStyle.Hidden }; p.ArgumentList.Add("/c"); p.ArgumentList.Add("timeout /t 3 /nobreak >nul & sc.exe start HROneSyncService >nul"); Process.Start(p); } catch { } }\n    private static bool ScheduleGitHubUpdate()\n    {\n        try\n        {\n            var instanceRoot = Path.GetFullPath(Path.Combine(AppContext.BaseDirectory, "..", ".."));\n            var script = Path.Combine(instanceRoot, "Tools", "dashboard-update-from-github.bat");\n            if (!File.Exists(script)) return false;\n            var p = new ProcessStartInfo\n            {\n                FileName = "cmd.exe",\n                UseShellExecute = false,\n                CreateNoWindow = true,\n                WorkingDirectory = instanceRoot\n            };\n            p.ArgumentList.Add("/c");\n            p.ArgumentList.Add($"call \\\"{script}\\\"");\n            Process.Start(p);\n            return true;\n        }\n        catch { return false; }\n    }'''

          if old2 not in s:
              raise SystemExit('Expected ScheduleServiceStart block was not found')
          s = s.replace(old2, new2, 1)

          p.write_text(s, encoding='utf-8')

      - name: Verify patch
        run: |
          grep -F 'GitHub update started' HROneSync/HROneSyncService/Dashboard.cs
          grep -F 'ScheduleGitHubUpdate' HROneSync/HROneSyncService/Dashboard.cs

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-dashboard-update.yml
          git add HROneSync/HROneSyncService/Dashboard.cs .github/workflows/fix-dashboard-update.yml
          git commit -m "Fix dashboard Update to pull from GitHub" || exit 0
          git push origin main
