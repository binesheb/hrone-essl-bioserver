name: Style pending and uploaded text

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch dashboard styles
        shell: python
        run: |
          from pathlib import Path

          p = Path('HROneSync/HROneSyncService/Dashboard.cs')
          s = p.read_text(encoding='utf-8')

          old_css = '.success{color:var(--g)}.warn{color:var(--a)}.badge{display:inline-flex;'
          new_css = '.success{color:var(--g)}.uploaded-text{color:var(--g);font-weight:800}.pending-text{color:var(--r);font-weight:800}.warn{color:var(--a)}.badge{display:inline-flex;'
          if old_css not in s:
              raise SystemExit('Expected dashboard CSS anchor not found')
          s = s.replace(old_css, new_css, 1)

          old_render = "$('today').textContent=s.totalToday.toLocaleString();$('uploaded').textContent=s.uploadedToday.toLocaleString();$('pending').textContent=s.pending.toLocaleString();$('pendingInline').textContent=s.pending.toLocaleString();"
          new_render = "$('today').textContent=s.totalToday.toLocaleString();$('uploaded').textContent=s.uploadedToday.toLocaleString();$('uploaded').className='value uploaded-text';$('pending').textContent=s.pending.toLocaleString();$('pending').className='value pending-text';$('pendingInline').textContent=s.pending.toLocaleString();$('pendingInline').className='value pending-text';"
          if old_render not in s:
              raise SystemExit('Expected dashboard render anchor not found')
          s = s.replace(old_render, new_render, 1)

          old_status = "'<td>'+x.time+'</td><td>'+esc(x.machine)+'</td><td>'+x.status+'</td></tr>'"
          new_status = "'<td>'+x.time+'</td><td>'+esc(x.machine)+'</td><td><span class=\"'+(x.status==='Uploaded'?'uploaded-text':'pending-text')+'\">'+x.status+'</span></td></tr>'"
          if old_status not in s:
              raise SystemExit('Expected recent-status anchor not found')
          s = s.replace(old_status, new_status, 1)

          p.write_text(s, encoding='utf-8')

      - name: Verify
        run: |
          grep -F 'uploaded-text' HROneSync/HROneSyncService/Dashboard.cs
          grep -F 'pending-text' HROneSync/HROneSyncService/Dashboard.cs

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/style-pending-upload.yml
          git add HROneSync/HROneSyncService/Dashboard.cs .github/workflows/style-pending-upload.yml
          git commit -m "Use distinct colors for Pending and Uploaded" || exit 0
          git push origin main
