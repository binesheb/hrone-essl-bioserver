name: Apply Dashboard Fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Apply dashboard fixes and updater instrumentation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch dashboard and updater
        shell: python
        run: |
          from pathlib import Path
          import re

          dashboard = Path('HROneSync/HROneSyncService/Dashboard.cs')
          s = dashboard.read_text(encoding='utf-8')

          old = 'if (path == "/api/service/control" && context.Request.HttpMethod == "POST") { await ServiceControl(context); return; }'
          new = old + '\n            if (path == "/api/update-status" && context.Request.HttpMethod == "GET") { await WriteJson(context, GetUpdateStatus(), 200); return; }'
          assert s.count(old) == 1
          s = s.replace(old, new)

          marker = '    private static async Task ServiceControl(HttpListenerContext context)\n'
          method = '''    private static object GetUpdateStatus()\n    {\n        try\n        {\n            var path = Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.CommonApplicationData), "HROneSyncService", "update-status.json");\n            if (!File.Exists(path)) return new { ok = true, status = "idle", stage = "Ready", progress = 0, message = "No update is running.", startedAt = (string?)null, completedAt = (string?)null, commit = (string?)null, error = (string?)null };\n            using var stream = File.OpenRead(path);\n            using var doc = JsonDocument.Parse(stream);\n            return new { ok = true, status = doc.RootElement.TryGetProperty("status", out var st) ? st.GetString() : "idle", stage = doc.RootElement.TryGetProperty("stage", out var sg) ? sg.GetString() : "Ready", progress = doc.RootElement.TryGetProperty("progress", out var pr) ? pr.GetInt32() : 0, message = doc.RootElement.TryGetProperty("message", out var msg) ? msg.GetString() : "", startedAt = doc.RootElement.TryGetProperty("startedAt", out var sa) ? sa.GetString() : null, completedAt = doc.RootElement.TryGetProperty("completedAt", out var ca) ? ca.GetString() : null, commit = doc.RootElement.TryGetProperty("commit", out var co) ? co.GetString() : null, error = doc.RootElement.TryGetProperty("error", out var er) ? er.GetString() : null };\n        }\n        catch (Exception ex)\n        {\n            return new { ok = false, status = "error", stage = "Status read failed", progress = 0, message = ex.Message, startedAt = (string?)null, completedAt = (string?)null, commit = (string?)null, error = ex.Message };\n        }\n    }\n\n'''
          assert s.count(marker) == 1
          s = s.replace(marker, method + marker)

          old = 'var uploaded = await ScalarLong(c, "SELECT COUNT_BIG(*) FROM dbo.HROnePunchStatus WHERE Status=\'Uploaded\' AND EXISTS (SELECT 1 FROM eBioServerNew.dbo.DeviceLogs dl WHERE dl.DeviceLogId=HROnePunchStatus.DeviceLogId AND CAST(dl.LogDate AS date)=CAST(GETDATE() AS date))"); var pending = await ScalarLong(c, "SELECT COUNT_BIG(*) FROM dbo.HROnePunchStatus WHERE Status=\'Pending\'");'
          new = old + ' var ignored = await ScalarLong(c, "SELECT COUNT_BIG(*) FROM dbo.HROnePunchStatus WHERE Status=\'Ignored\' AND EXISTS (SELECT 1 FROM eBioServerNew.dbo.DeviceLogs dl WHERE dl.DeviceLogId=HROnePunchStatus.DeviceLogId AND CAST(dl.LogDate AS date)=CAST(GETDATE() AS date))");'
          assert s.count(old) == 1
          s = s.replace(old, new)

          old = 'summary = new { totalToday = today, uploadedToday = uploaded, pending, pendingPunchOut, successRate = today == 0 ? 100 : Math.Round(uploaded * 100.0 / today, 1), lastProcessedId = last, latestLogId = latest }'
          new = 'summary = new { totalToday = today, uploadedToday = uploaded, ignoredToday = ignored, pending, pendingPunchOut, successRate = today == 0 ? 100 : Math.Round((uploaded + ignored) * 100.0 / today, 1), lastProcessedId = last, latestLogId = latest }'
          assert s.count(old) == 1
          s = s.replace(old, new)

          s = s.replace('<div id="serviceMsg" class="msg"></div>', '<div id="serviceMsg" class="msg"></div><div id="updateProgress" class="update-progress"><div class="small" id="updateStage">Update status: —</div><div class="progress-track"><div id="updateBar" class="progress-bar"></div></div><div class="small" id="updateDetail">—</div></div>')
          s = s.replace('.secondary{background:#253149;color:var(--t);border:1px solid #35435d}', '.secondary{background:#253149;color:var(--t);border:1px solid #35435d}.update-progress{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--b)}.progress-track{height:7px;background:#0a1020;border-radius:99px;overflow:hidden;margin:6px 0}.progress-bar{height:100%;width:0;background:var(--g);transition:width .3s ease}')

          old = "async function service(action){if(action!=='update'&&!confirm((action==='stop'?'Stop':'Restart')+' the service?'))return;$('serviceMsg').textContent='Requesting '+action+'...';try{const j=await getJson('/api/service/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});$('serviceMsg').textContent=j.message||'Done';}catch(e){$('serviceMsg').textContent=e.message}}"
          new = "async function updateStatus(){try{const u=await getJson('/api/update-status');const box=$('updateProgress');if(u.status==='running'||u.status==='failed'||u.status==='completed'){box.style.display='block';$('updateStage').textContent=(u.stage||'Update')+' • '+(u.progress||0)+'%';$('updateBar').style.width=Math.max(0,Math.min(100,u.progress||0))+'%';$('updateDetail').textContent=u.error||u.message||'';}else{box.style.display='none'}}catch{}}\nasync function service(action){if(action!=='update'&&!confirm((action==='stop'?'Stop':'Restart')+' the service?'))return;$('serviceMsg').textContent='Requesting '+action+'...';try{const j=await getJson('/api/service/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});$('serviceMsg').textContent=j.message||'Done';if(action==='update'){updateStatus();setTimeout(updateStatus,1000);}}catch(e){$('serviceMsg').textContent=e.message}}"
          assert s.count(old) == 1
          s = s.replace(old, new)
          s = s.replace('health();setInterval(poll,10000);setInterval(()=>refresh(\'Safe interval\'),60000);setInterval(health,30000);', 'health();updateStatus();setInterval(poll,10000);setInterval(()=>refresh(\'Safe interval\'),60000);setInterval(health,30000);setInterval(updateStatus,2000);')
          dashboard.write_text(s, encoding='utf-8')

          updater = Path('Tools/dashboard-update-from-github.bat')
          u = updater.read_text(encoding='utf-8')
          u = u.replace('set "STATUS=%SCRIPT_DIR%update-status.json"', 'set "STATUS=%ProgramData%\\HROneSyncService\\update-status.json"\nif not exist "%ProgramData%\\HROneSyncService\\" mkdir "%ProgramData%\\HROneSyncService"')
          u = u.replace('>"%STATUS%" echo {"status":"running","stage":"Starting","progress":5,"message":"Update requested.","startedAt":"%date% %time%","completedAt":null,"commit":null,"error":null}', '>"%STATUS%" echo {"status":"running","stage":"Starting","progress":5,"message":"Update requested.","startedAt":"%date% %time%","completedAt":null,"commit":null,"error":null}')
          updater.write_text(u, encoding='utf-8')

          status = Path('Tools/rebuild-republish-restart.bat')
          b = status.read_text(encoding='utf-8')
          b = b.replace('cd /d "%INSTANCE_ROOT%"', 'cd /d "%INSTANCE_ROOT%"\n\ncall :UpdateStatus "Preparing update" 8 "Preparing deployment."')
          replacements = [
            ('echo [1/9] Stopping %SERVICE% before update...', 'call :UpdateStatus "Stopping service" 12 "Stopping Windows service safely."\n    echo [1/9] Stopping %SERVICE% before update...'),
            ('echo [2/9] Git repository detected. Forcing origin/main...', 'call :UpdateStatus "Fetching GitHub" 25 "Fetching and synchronizing origin/main."\n    echo [2/9] Git repository detected. Forcing origin/main...'),
            ('echo [3/9] Cleaning source build artifacts...', 'call :UpdateStatus "Cleaning" 38 "Cleaning source build artifacts."\necho [3/9] Cleaning source build artifacts...'),
            ('echo [4/9] Restoring dependencies...', 'call :UpdateStatus "Restoring dependencies" 50 "Restoring NuGet dependencies."\necho [4/9] Restoring dependencies...'),
            ('echo [5/9] Building Release...', 'call :UpdateStatus "Building" 62 "Building Release configuration."\necho [5/9] Building Release...'),
            ('echo [6/9] Publishing to:', 'call :UpdateStatus "Publishing" 74 "Publishing the service."\necho [6/9] Publishing to:'),
            ('echo [7/9] Switching Windows service to THIS INSTANCE...', 'call :UpdateStatus "Configuring service" 84 "Configuring Windows Service."\necho [7/9] Switching Windows service to THIS INSTANCE...'),
            ('echo [8/9] Verifying Windows service path...', 'call :UpdateStatus "Verifying service" 91 "Verifying the installed service path."\necho [8/9] Verifying Windows service path...'),
            ('echo [9/9] Starting %SERVICE%...', 'call :UpdateStatus "Starting service" 96 "Starting service and checking Dashboard."\necho [9/9] Starting %SERVICE%...'),
            ('echo DEPLOYMENT COMPLETE', 'call :UpdateStatus "Completed" 100 "Update completed successfully."\necho DEPLOYMENT COMPLETE')]
          for old,new in replacements:
            assert b.count(old) == 1, old
            b = b.replace(old,new)
          b += '''\n\n:UpdateStatus\nset "US_STAGE=%~1"\nset "US_PROGRESS=%~2"\nset "US_MESSAGE=%~3"\nset "US_STATUS=%ProgramData%\\HROneSyncService\\update-status.json"\nif not exist "%ProgramData%\\HROneSyncService\\" mkdir "%ProgramData%\\HROneSyncService" >nul 2>&1\n>"%US_STATUS%" echo {"status":"running","stage":"%US_STAGE%","progress":%US_PROGRESS%,"message":"%US_MESSAGE%","startedAt":"%date% %time%","completedAt":null,"commit":null,"error":null}\nexit /b 0\n'''
          status.write_text(b, encoding='utf-8')

      - name: Build service
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build HROneSync/HROneSyncService/HROneSyncService.csproj -c Release

      - name: Commit changes
        run: |
          rm -f .github/workflows/fix-dashboard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HROneSync/HROneSyncService/Dashboard.cs Tools/dashboard-update-from-github.bat Tools/rebuild-republish-restart.bat
          git commit -m "Apply dashboard fixes and updater instrumentation"
          git push origin main
