name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5f # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore HROneSync/HROneSyncService/HROneSyncService.csproj
      - name: Build
        run: dotnet build HROneSync/HROneSyncService/HROneSyncService.csproj --configuration Release --no-restore
      - name: Publish
        run: dotnet publish HROneSync/HROneSyncService/HROneSyncService.csproj --configuration Release --no-restore --output ./publish
      - name: Verify publish output
        shell: pwsh
        run: |
          if (-not (Test-Path ./publish/HROneSyncService.exe)) {
            throw "Expected HROneSyncService.exe was not produced by dotnet publish."
          }
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Path . -Filter *.ps1 -File -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $errors += "${($_.FullName)}: $($parseErrors -join '; ')"
            }
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "All PowerShell scripts passed syntax validation."
