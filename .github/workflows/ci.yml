name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore HROneSync/HROneSyncService/HROneSyncService.csproj
      - name: Build
        run: dotnet build HROneSync/HROneSyncService/HROneSyncService.csproj --configuration Release --no-restore
