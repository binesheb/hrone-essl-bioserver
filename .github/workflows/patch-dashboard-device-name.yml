name: Temporary Dashboard Device Name Patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-dashboard-device-name.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Dashboard.cs
        shell: python
        run: |
          from pathlib import Path
          path = Path('HROneSync/HROneSyncService/Dashboard.cs')
          text = path.read_text(encoding='utf-8')
          old_sql = '''const string sql = @"SELECT TOP 25 d.DeviceLogId, d.EmployeeCode, e.EmployeeName, d.LogDate, d.DeviceId\nFROM eBioServerNew.dbo.DeviceLogs d\nLEFT JOIN eBioServerNew.dbo.Employees e ON e.EmployeeCode = d.EmployeeCode\nORDER BY d.DeviceLogId DESC";'''
          new_sql = '''const string sql = @"SELECT TOP 25 d.DeviceLogId, d.EmployeeCode, e.EmployeeName, d.LogDate, d.DeviceId, dev.DeviceName\nFROM eBioServerNew.dbo.DeviceLogs d\nLEFT JOIN eBioServerNew.dbo.Employees e ON e.EmployeeCode = d.EmployeeCode\nLEFT JOIN eBioServerNew.dbo.Devices dev ON dev.DeviceId = d.DeviceId\nORDER BY d.DeviceLogId DESC";'''
          old_row = '''r.Add(new { id = rd.GetInt64(0), employee = name, employeeCode = code, time = rd.GetDateTime(3).ToString("yyyy-MM-dd HH:mm:ss"), machine = rd.GetValue(4).ToString(), status = rd.GetInt64(0) <= last ? "Uploaded" : "Pending" });'''
          new_row = '''var deviceName = rd.IsDBNull(5) ? "-" : rd.GetString(5);\n            r.Add(new { id = rd.GetInt64(0), employee = name, employeeCode = code, time = rd.GetDateTime(3).ToString("yyyy-MM-dd HH:mm:ss"), machine = deviceName, status = rd.GetInt64(0) <= last ? "Uploaded" : "Pending" });'''
          old_header = '<th>Device</th>'
          new_header = '<th>Device Name</th>'
          if old_sql not in text:
              raise SystemExit('Expected SQL block not found; refusing unsafe modification.')
          if old_row not in text:
              raise SystemExit('Expected recent-punch row block not found; refusing unsafe modification.')
          if old_header not in text:
              raise SystemExit('Expected Device header not found; refusing unsafe modification.')
          text = text.replace(old_sql, new_sql, 1)
          text = text.replace(old_row, new_row, 1)
          text = text.replace(old_header, new_header, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit Dashboard change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HROneSync/HROneSyncService/Dashboard.cs
          git rm .github/workflows/patch-dashboard-device-name.yml
          git commit -m "Dashboard: show ESSL device name for recent punches"
          git push
