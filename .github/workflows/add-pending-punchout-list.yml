name: Add Pending Punch-Out List
on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/add-pending-punchout-list.yml
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Add pending punch-out list implementation') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard
        shell: python
        run: |
          from pathlib import Path
          p=Path('HROneSync/HROneSyncService/Dashboard.cs')
          s=p.read_text(encoding='utf-8')
          old='if (path == "/api/punch-state" && context.Request.HttpMethod == "GET") { await WriteJson(context, await GetPunchState(), 200); return; }'
          new=old+'\n            if (path == "/api/pending-punch-out" && context.Request.HttpMethod == "GET") { await WriteJson(context, await GetPendingPunchOut(), 200); return; }'
          if old not in s or '/api/pending-punch-out' not in s:
              if '/api/pending-punch-out' not in s: raise SystemExit('route anchor not found')
          else: s=s.replace(old,new,1)
          marker='    private static async Task<object> GetPunchState()'
          method='''    private static async Task<object> GetPendingPunchOut()\n    {\n        try\n        {\n            await using var c = await OpenConnection();\n            const string sql = @"WITH LatestPunch AS (\n                SELECT d.EmployeeCode, e.EmployeeName, d.LogDate, d.DeviceId, dev.DeviceName, d.Direction,\n                       ROW_NUMBER() OVER (PARTITION BY d.EmployeeCode ORDER BY d.LogDate DESC, d.DeviceLogId DESC) AS rn\n                FROM eBioServerNew.dbo.DeviceLogs d\n                LEFT JOIN eBioServerNew.dbo.Employees e ON e.EmployeeCode=d.EmployeeCode\n                LEFT JOIN eBioServerNew.dbo.Devices dev ON dev.DeviceId=d.DeviceId\n                WHERE CAST(d.LogDate AS date)=CAST(GETDATE() AS date)\n                  AND d.EmployeeCode IS NOT NULL AND LTRIM(RTRIM(d.EmployeeCode))<>''\'')\n                SELECT EmployeeCode, EmployeeName, LogDate, DeviceId, DeviceName\n                FROM LatestPunch\n                WHERE rn=1 AND UPPER(LTRIM(RTRIM(ISNULL(Direction,''\''))))=''IN''\'\'\n                ORDER BY LogDate ASC";\n            await using var cmd=new SqlCommand(sql,c){CommandTimeout=10};\n            await using var rd=await cmd.ExecuteReaderAsync();\n            var rows=new List<object>();\n            while(await rd.ReadAsync()) rows.Add(new { employeeCode=rd.IsDBNull(0)?"-":rd.GetString(0), employeeName=rd.IsDBNull(1)?"-":rd.GetString(1), lastPunch=rd.GetDateTime(2), deviceId=rd.IsDBNull(3)?"-":rd.GetValue(3).ToString(), deviceName=rd.IsDBNull(4)?"-":rd.GetString(4) });\n            return new { ok=true, generatedAt=DateTime.Now, count=rows.Count, staff=rows };\n        }\n        catch(Exception ex){ return new { ok=false, error=ex.Message, type=ex.GetType().Name, count=0, staff=Array.Empty<object>() }; }\n    }\n\n'''
          if 'GetPendingPunchOut()' not in s: s=s.replace(marker,method+marker,1)
          # Make the card clickable.
          card='<div class="panel card"><div class="label">Pending Punch-Out</div><div id="pendingPunchOut" class="value">—</div><div class="small">Latest punch is IN</div></div>'
          card2='<div id="pendingPunchOutCard" class="panel card" style="cursor:pointer"><div class="label">Pending Punch-Out</div><div id="pendingPunchOut" class="value">—</div><div class="small">Click to view staff</div></div>'
          if card in s: s=s.replace(card,card2,1)
          # Add modal before script.
          modal='''<div id="pendingModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;padding:5vh 4vw;overflow:auto"><div class="panel" style="max-width:900px;margin:auto"><div class="sectionhead"><h3>Staff Pending Punch-Out</h3><button id="closePending" class="secondary">Close</button></div><div class="small" id="pendingMeta" style="margin:8px 0"></div><div class="tablewrap"><table><thead><tr><th>Employee Code</th><th>Employee Name</th><th>Last Punch</th><th>Device</th></tr></thead><tbody id="pendingList"></tbody></table></div></div></div>\n'''
          if 'id="pendingModal"' not in s: s=s.replace('<script>\n',modal+'<script>\n',1)
          # Add JS functions and handler.
          js='''async function showPendingPunchOut(){const m=$('pendingModal');m.style.display='block';$('pendingList').innerHTML='<tr><td colspan="4">Loading...</td></tr>';try{const j=await getJson('/api/pending-punch-out');if(!j.ok)throw new Error(j.error||'Unable to load list');$('pendingMeta').textContent=j.count+' staff • '+new Date(j.generatedAt).toLocaleString();$('pendingList').innerHTML=j.staff.map(x=>'<tr><td>'+esc(x.employeeCode)+'</td><td><strong>'+esc(x.employeeName)+'</strong></td><td>'+new Date(x.lastPunch).toLocaleTimeString()+'</td><td>'+esc(x.deviceName)+' ('+esc(x.deviceId)+')</td></tr>').join('')||'<tr><td colspan="4">No staff pending punch-out.</td></tr>'}catch(e){$('pendingList').innerHTML='<tr><td colspan="4">'+esc(e.message)+'</td></tr>'}}\n$('pendingPunchOutCard').onclick=showPendingPunchOut;$('closePending').onclick=()=>{$('pendingModal').style.display='none'};\n'''
          if 'showPendingPunchOut' not in s: s=s.replace("$('refresh').onclick=()=>refresh('Manual');",js+"$('refresh').onclick=()=>refresh('Manual');",1)
          p.write_text(s,encoding='utf-8')
      - name: Build
        run: dotnet build HROneSync/HROneSyncService/HROneSyncService.csproj --configuration Release --no-restore
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HROneSync/HROneSyncService/Dashboard.cs
          git diff --cached --quiet || git commit -m 'Add clickable pending punch-out list'
          git push
